<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" width="100%" height="100%">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 7 5 L 1 8 z" fill="#2d3748" />
    </marker>
  </defs>

  <style>
    .bg { fill: #ffffff; }
    .box-blue { fill: #0078d4; }
    .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13.5px; fill: #2d3748; text-anchor: middle; }
    .line { stroke: #2d3748; stroke-width: 1.5; fill: none; marker-end: url(#arr); }
    .line-noarr { stroke: #2d3748; stroke-width: 1.5; fill: none; }
    .icon-white { fill: none; stroke: #ffffff; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- Background -->
  <rect width="1100" height="360" class="bg" />

  <!-- ================= TOP MAIN ROW ================= -->

  <!-- 1. Raw (Hard Drive Icon) -->
  <g transform="translate(40, 35)">
    <rect width="64" height="64" class="box-blue" rx="1" />
    <!-- HDD icon -->
    <rect x="15" y="12" width="34" height="40" rx="3" class="icon-white" />
    <circle cx="32" cy="28" r="9" class="icon-white" />
    <circle cx="32" cy="28" r="2.5" fill="#ffffff" stroke="none" />
    <line x1="32" y1="28" x2="25" y2="35" class="icon-white" />
    <circle cx="43" cy="46" r="1.5" fill="#ffffff" stroke="none" />
    <text x="32" y="85" class="label">Raw</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="104" y1="67" x2="195" y2="67" class="line" />

  <!-- 2. Staging (Server Icon) -->
  <g transform="translate(195, 35)">
    <rect width="64" height="64" class="box-blue" rx="1" />
    <!-- Server Stack -->
    <rect x="14" y="14" width="36" height="10" rx="1.5" class="icon-white" />
    <circle cx="19" cy="19" r="1" fill="#ffffff" stroke="none" />
    <circle cx="23" cy="19" r="1" fill="#ffffff" stroke="none" />
    <line x1="28" y1="19" x2="45" y2="19" class="icon-white" stroke-width="1.2" />

    <rect x="14" y="27" width="36" height="10" rx="1.5" class="icon-white" />
    <circle cx="19" cy="32" r="1" fill="#ffffff" stroke="none" />
    <circle cx="23" cy="32" r="1" fill="#ffffff" stroke="none" />
    <line x1="28" y1="32" x2="45" y2="32" class="icon-white" stroke-width="1.2" />

    <rect x="14" y="40" width="36" height="10" rx="1.5" class="icon-white" />
    <circle cx="19" cy="45" r="1" fill="#ffffff" stroke="none" />
    <circle cx="23" cy="45" r="1" fill="#ffffff" stroke="none" />
    <line x1="28" y1="45" x2="45" y2="45" class="icon-white" stroke-width="1.2" />
    <text x="32" y="85" class="label">Staging</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="259" y1="67" x2="350" y2="67" class="line" />

  <!-- 3. Clean (Server Icon) -->
  <g transform="translate(350, 35)">
    <rect width="64" height="64" class="box-blue" rx="1" />
    <!-- Server Stack -->
    <rect x="14" y="14" width="36" height="10" rx="1.5" class="icon-white" />
    <circle cx="19" cy="19" r="1" fill="#ffffff" stroke="none" />
    <circle cx="23" cy="19" r="1" fill="#ffffff" stroke="none" />
    <line x1="28" y1="19" x2="45" y2="19" class="icon-white" stroke-width="1.2" />

    <rect x="14" y="27" width="36" height="10" rx="1.5" class="icon-white" />
    <circle cx="19" cy="32" r="1" fill="#ffffff" stroke="none" />
    <circle cx="23" cy="32" r="1" fill="#ffffff" stroke="none" />
    <line x1="28" y1="32" x2="45" y2="32" class="icon-white" stroke-width="1.2" />

    <rect x="14" y="40" width="36" height="10" rx="1.5" class="icon-white" />
    <circle cx="19" cy="45" r="1" fill="#ffffff" stroke="none" />
    <circle cx="23" cy="45" r="1" fill="#ffffff" stroke="none" />
    <line x1="28" y1="45" x2="45" y2="45" class="icon-white" stroke-width="1.2" />
    <text x="32" y="85" class="label">Clean</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="414" y1="67" x2="505" y2="67" class="line" />

  <!-- 4. Golden (Cylinder Database Icon) -->
  <g transform="translate(505, 35)">
    <rect width="64" height="64" class="box-blue" rx="1" />
    <!-- Database Cylinder -->
    <ellipse cx="32" cy="20" rx="17" ry="6" class="icon-white" />
    <path d="M 15 20 v 10 c 0 3.3 7.6 6 17 6 s 17 -2.7 17 -6 v -10" class="icon-white" />
    <path d="M 15 30 v 10 c 0 3.3 7.6 6 17 6 s 17 -2.7 17 -6 v -10" class="icon-white" />
    <path d="M 15 40 v 10 c 0 3.3 7.6 6 17 6 s 17 -2.7 17 -6 v -10" class="icon-white" />
    <text x="32" y="85" class="label">Golden</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <line x1="569" y1="67" x2="660" y2="67" class="line" />

  <!-- 5. Feature (Server Icon) -->
  <g transform="translate(660, 35)">
    <rect width="64" height="64" class="box-blue" rx="1" />
    <!-- Server Stack -->
    <rect x="14" y="14" width="36" height="10" rx="1.5" class="icon-white" />
    <circle cx="19" cy="19" r="1" fill="#ffffff" stroke="none" />
    <circle cx="23" cy="19" r="1" fill="#ffffff" stroke="none" />
    <line x1="28" y1="19" x2="45" y2="19" class="icon-white" stroke-width="1.2" />

    <rect x="14" y="27" width="36" height="10" rx="1.5" class="icon-white" />
    <circle cx="19" cy="32" r="1" fill="#ffffff" stroke="none" />
    <circle cx="23" cy="32" r="1" fill="#ffffff" stroke="none" />
    <line x1="28" y1="32" x2="45" y2="32" class="icon-white" stroke-width="1.2" />

    <rect x="14" y="40" width="36" height="10" rx="1.5" class="icon-white" />
    <circle cx="19" cy="45" r="1" fill="#ffffff" stroke="none" />
    <circle cx="23" cy="45" r="1" fill="#ffffff" stroke="none" />
    <line x1="28" y1="45" x2="45" y2="45" class="icon-white" stroke-width="1.2" />
    <text x="32" y="85" class="label">Feature</text>
  </g>

  <!-- Arrow 5 -> 6 -->
  <line x1="724" y1="67" x2="815" y2="67" class="line" />

  <!-- 6. Metrics (Cylinder Database Icon) -->
  <g transform="translate(815, 35)">
    <rect width="64" height="64" class="box-blue" rx="1" />
    <!-- Database Cylinder -->
    <ellipse cx="32" cy="20" rx="17" ry="6" class="icon-white" />
    <path d="M 15 20 v 10 c 0 3.3 7.6 6 17 6 s 17 -2.7 17 -6 v -10" class="icon-white" />
    <path d="M 15 30 v 10 c 0 3.3 7.6 6 17 6 s 17 -2.7 17 -6 v -10" class="icon-white" />
    <path d="M 15 40 v 10 c 0 3.3 7.6 6 17 6 s 17 -2.7 17 -6 v -10" class="icon-white" />
    <text x="32" y="85" class="label">Metrics</text>
  </g>

  <!-- Arrow 6 -> 7 -->
  <line x1="879" y1="67" x2="970" y2="67" class="line" />

  <!-- 7. Dashboard (Globe / Web Icon) -->
  <g transform="translate(970, 35)">
    <rect width="64" height="64" class="box-blue" rx="1" />
    <!-- Globe Icon -->
    <circle cx="32" cy="32" r="18" class="icon-white" />
    <line x1="14" y1="32" x2="50" y2="32" class="icon-white" />
    <line x1="32" y1="14" x2="32" y2="50" class="icon-white" />
    <ellipse cx="32" cy="32" rx="9" ry="18" class="icon-white" />
    <text x="32" y="85" class="label">Dashboard</text>
  </g>


  <!-- ================= BRANCHES & BOTTOM ROW ================= -->

  <!-- Branch from Golden to Quality & Lineage -->
  <!-- Diagonal line down-left -->
  <line x1="537" y1="99" x2="417" y2="190" class="line-noarr" />

  <!-- Quality and Lineage Box -->
  <g transform="translate(385, 190)">
    <rect width="64" height="64" class="box-blue" rx="1" />
    <!-- Server Stack -->
    <rect x="14" y="14" width="36" height="10" rx="1.5" class="icon-white" />
    <circle cx="19" cy="19" r="1" fill="#ffffff" stroke="none" />
    <circle cx="23" cy="19" r="1" fill="#ffffff" stroke="none" />
    <line x1="28" y1="19" x2="45" y2="19" class="icon-white" stroke-width="1.2" />

    <rect x="14" y="27" width="36" height="10" rx="1.5" class="icon-white" />
    <circle cx="19" cy="32" r="1" fill="#ffffff" stroke="none" />
    <circle cx="23" cy="32" r="1" fill="#ffffff" stroke="none" />
    <line x1="28" y1="32" x2="45" y2="32" class="icon-white" stroke-width="1.2" />

    <rect x="14" y="40" width="36" height="10" rx="1.5" class="icon-white" />
    <circle cx="19" cy="45" r="1" fill="#ffffff" stroke="none" />
    <circle cx="23" cy="45" r="1" fill="#ffffff" stroke="none" />
    <line x1="28" y1="45" x2="45" y2="45" class="icon-white" stroke-width="1.2" />

    <text x="32" y="83" class="label">Quality and</text>
    <text x="32" y="100" class="label">Lineage</text>
  </g>

  <!-- Branch from Golden to Incremental Processing -->
  <!-- Vertical line down -->
  <line x1="537" y1="99" x2="537" y2="220" class="line-noarr" />

  <!-- Incremental Processing Box -->
  <g transform="translate(505, 220)">
    <rect width="64" height="64" class="box-blue" rx="1" />
    <!-- Server Stack -->
    <rect x="14" y="14" width="36" height="10" rx="1.5" class="icon-white" />
    <circle cx="19" cy="19" r="1" fill="#ffffff" stroke="none" />
    <circle cx="23" cy="19" r="1" fill="#ffffff" stroke="none" />
    <line x1="28" y1="19" x2="45" y2="19" class="icon-white" stroke-width="1.2" />

    <rect x="14" y="27" width="36" height="10" rx="1.5" class="icon-white" />
    <circle cx="19" cy="32" r="1" fill="#ffffff" stroke="none" />
    <circle cx="23" cy="32" r="1" fill="#ffffff" stroke="none" />
    <line x1="28" y1="32" x2="45" y2="32" class="icon-white" stroke-width="1.2" />

    <rect x="14" y="40" width="36" height="10" rx="1.5" class="icon-white" />
    <circle cx="19" cy="45" r="1" fill="#ffffff" stroke="none" />
    <circle cx="23" cy="45" r="1" fill="#ffffff" stroke="none" />
    <line x1="28" y1="45" x2="45" y2="45" class="icon-white" stroke-width="1.2" />

    <text x="32" y="83" class="label">Incremental</text>
    <text x="32" y="100" class="label">Processing</text>
  </g>

  <!-- Branch from Metrics to Monitoring and Governance -->
  <!-- Vertical line down -->
  <line x1="847" y1="99" x2="847" y2="220" class="line-noarr" />

  <!-- Monitoring and Governance Box -->
  <g transform="translate(815, 220)">
    <rect width="64" height="64" class="box-blue" rx="1" />
    <!-- Server Stack -->
    <rect x="14" y="14" width="36" height="10" rx="1.5" class="icon-white" />
    <circle cx="19" cy="19" r="1" fill="#ffffff" stroke="none" />
    <circle cx="23" cy="19" r="1" fill="#ffffff" stroke="none" />
    <line x1="28" y1="19" x2="45" y2="19" class="icon-white" stroke-width="1.2" />

    <rect x="14" y="27" width="36" height="10" rx="1.5" class="icon-white" />
    <circle cx="19" cy="32" r="1" fill="#ffffff" stroke="none" />
    <circle cx="23" cy="32" r="1" fill="#ffffff" stroke="none" />
    <line x1="28" y1="32" x2="45" y2="32" class="icon-white" stroke-width="1.2" />

    <rect x="14" y="40" width="36" height="10" rx="1.5" class="icon-white" />
    <circle cx="19" cy="45" r="1" fill="#ffffff" stroke="none" />
    <circle cx="23" cy="45" r="1" fill="#ffffff" stroke="none" />
    <line x1="28" y1="45" x2="45" y2="45" class="icon-white" stroke-width="1.2" />

    <text x="32" y="83" class="label">Monitoring and</text>
    <text x="32" y="100" class="label">Governance</text>
  </g>

</svg>
